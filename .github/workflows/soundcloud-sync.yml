name: NovaNic - Synchroniser SoundCloud

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/soundcloud-sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: novanic-soundcloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 12
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Verifier les tests automatiques
        run: python -m unittest discover -s tests -v
      - name: Synchroniser la playlist et Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_AS_DRAFT: 'false'
        run: python scripts/sync_soundcloud.py
      - name: Enregistrer le catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chansons/ annonces/ journal/
          if ! git diff --cached --quiet; then
            git commit -m 'Synchroniser les chansons NovaNic'
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparer les fichiers GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Mettre le catalogue en ligne
        id: deployment
        uses: actions/deploy-pages@v4
